services:
  postgres:
    image: postgres:17.2-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-rent}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-rent}"]
      interval: 3s
      timeout: 3s
      retries: 15

  seaweedfs:
    image: chrislusf/seaweedfs:4.08
    command: mini -dir=/data -s3.port=8333 -s3.iam=false
    volumes:
      - seaweed_data:/data

  mailpit:
    image: axllent/mailpit:v1.24
    ports:
      - "127.0.0.1:8025:8025"

  notification-service:
    build:
      context: ./services/notification
    environment:
      PORT: "8082"
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-rent}?sslmode=disable
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-internal-token}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  rental-service:
    build:
      context: ./services/rental
    environment:
      PORT: "8081"
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-rent}?sslmode=disable
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: no-reply@sgu.test
      OTP_PEPPER: ${OTP_PEPPER:-local-dev-pepper}
      OTP_COOLDOWN_SECONDS: ${OTP_COOLDOWN_SECONDS:-30}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: ${S3_BUCKET:-campus-rent}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      NOTIFICATION_INTERNAL_URL: http://notification-service:8082
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-internal-token}
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_started
      mailpit:
        condition: service_started
    restart: unless-stopped

  caddy:
    image: caddy:2.9-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${WEB_DIST_DIR:-./services/web-placeholder}:/srv/web:ro
    depends_on:
      - rental-service
      - notification-service
    restart: unless-stopped

volumes:
  pg_data:
  seaweed_data:
